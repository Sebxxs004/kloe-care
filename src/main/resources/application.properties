spring.application.name=kloe-care

# DataSource: usa las variables de entorno de Supabase o valores por defecto locales
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Ajustable con la variable SPRING_JPA_HBM2DDL (validate|update|none)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
