spring.application.name=kloe-care

# DataSource: usa las variables de entorno de Supabase
# La URL debe venir del apartado Database -> Connection string de Supabase.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/kloe_care}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
# Ajustable con la variable SPRING_JPA_HBM2DDL (validate|update|none|create-drop)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HBM2DDL:create-drop}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
