<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Panel de Solicitudes</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #f8f9fa; }
        .card-indicator { border-left: 5px solid; }
        .border-total    { border-left-color: #0d6efd; }
        .border-pendiente{ border-left-color: #ffc107; }
        .border-aprobada { border-left-color: #198754; }
        .border-rechazada{ border-left-color: #dc3545; }
        .badge-PENDIENTE { background-color: #ffc107; color: #000; }
        .badge-APROBADA  { background-color: #198754; }
        .badge-RECHAZADA { background-color: #dc3545; }
        tr.estado-PENDIENTE { background-color: #fff8e1; }
        tr.estado-APROBADA  { background-color: #e8f5e9; }
        tr.estado-RECHAZADA { background-color: #ffebee; }
    </style>
</head>
<body>
<div class="container py-4">

    <h2 class="mb-4">📋 Panel de Solicitudes — Administrador</h2>

    <!-- Indicadores -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card card-indicator border-total shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Total</h6>
                    <h2 class="text-primary fw-bold" th:text="${total}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-indicator border-pendiente shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Pendientes</h6>
                    <h2 class="text-warning fw-bold" th:text="${pendientes}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-indicator border-aprobada shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Aprobadas</h6>
                    <h2 class="text-success fw-bold" th:text="${aprobadas}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card card-indicator border-rechazada shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Rechazadas</h6>
                    <h2 class="text-danger fw-bold" th:text="${rechazadas}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla de solicitudes -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Todas las solicitudes</h5>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Usuario solicitante</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Fecha creación</th>
                        <th>Observación</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${solicitudes}"
                        th:classappend="'estado-' + ${s.estado}">
                        <td th:text="${s.solicitante.fullName}">—</td>
                        <td th:text="${s.tipo}">—</td>
                        <td>
                            <span class="badge"
                                  th:classappend="'badge-' + ${s.estado}"
                                  th:text="${s.estado}">—</span>
                        </td>
                        <td th:text="${#temporals.format(s.fechaCreacion, 'dd/MM/yyyy HH:mm')}">—</td>
                        <td th:text="${s.observacion != null ? s.observacion : '—'}">—</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(solicitudes)}">
                        <td colspan="5" class="text-center text-muted">No hay solicitudes registradas</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
